; Witcher Senses Edit for Scavenger Sense
;
; Land an arrow, and Scavenger Sense tracks the target until it dies. Nothing to set for that.

[Sense]
; A tap of the left trigger turns the sense on or off: down and up within this many seconds, no other button touched.
; Holding the trigger, or using it with another button, does nothing here. 0 = no tap.
fTapSeconds=0.25

[Debug]
; 2 is info, the shipped default. For a bug report set 0, reproduce it, and send
; Documents\My Games\Skyrim Special Edition\SKSE\WitcherSensesEdit.log
uLogLevel=2
