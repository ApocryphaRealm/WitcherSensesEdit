; Witcher Senses Edit for Scavenger Sense
;
; Read after Scavenger Sense's installer answers. Your own ScavengerSense.ini overrides this file key by key, so
; pressing "Save to INI" in its menu takes over from here.

; A quick tap of the left trigger or a press of G sends one sense pulse, which fades by itself. On a mount they do nothing.
; The tap is the add-on's own, so holding the trigger as a modifier stays free: Scavenger Sense's gamepad key is off.
[Hotkey]
trigger = press
toggle = false
holdTime = 0.45
gamepad = -1
keyboard = 34

; Tracking comes from your arrows, so it needs no keys of its own. Everyone you hit stays tracked at once.
; Footprints show whenever you crouch, no button. Tracked targets' trails stay visible standing.
[Tracks]
enabled = true
reveal = crouch
multiMark = true
keyMode = single
style = chevrons
gamepad = -1
key = -1
wipeGamepad = -1
wipeKey = -1

; Highlights without name pop-ups.
[Labels]
enable = false

; A strong, solid glow on everything: people, corpses and small items as well as containers. Containers yellow, enemies red.
[Categories]
containerColor = 0xFFD800
actor = true
actorFilter = all
actorByDisposition = true
hostileColor = 0xFF1A1A
deadColor = 0xB4B4B4
containerOutlineOnly = false
doorOutlineOnly = false
floraOutlineOnly = false
gearOutlineOnly = false
alchemyOutlineOnly = false
bookOutlineOnly = false
valuableOutlineOnly = false
activatorOutlineOnly = false
furnitureOutlineOnly = false
actorOutlineOnly = false

[Vision]
glowStrength = 1.8
edgeFalloff = 1.0

[Effects]
screenEnabled = true
screenStrength = 1.0

; The sweep's screen effect runs over the whole finished frame, glow included, so draining the colour turned every
; highlight toward white. The colours stay; the vignette stays.
[Tint]
enable = true
saturation = 1.0
brightness = 1.0
contrast = 1.0
castAmount = 0.0
overlay = true

[Sound]
enabled = false

; None of Scavenger Sense's HUD extras: only the sense itself and the trails.
[Self]
bars = false
overhead = false
hudCorner = off

[Player]
level = false
power = false
shout = false
readyFlash = false
gold = false
weight = false
cold = false

[Vitals]
actors = false
combat = false
lockMark = off
pushTrueHUD = false
lockHaze = false
