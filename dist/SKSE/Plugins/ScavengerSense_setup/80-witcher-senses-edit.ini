; Witcher Senses Edit for Scavenger Sense
;
; Read after Scavenger Sense's installer answers. Your own ScavengerSense.ini overrides this file key by key, so
; pressing "Save to INI" in its menu takes over from here.

; Hold activate to sense, so a double tap in a menu can't set it off.
[Hotkey]
trigger = hold
holdTime = 0.45
gamepad = 276
keyboard = 21

; Tracking comes from your arrows, so it needs no keys of its own. Everyone you hit stays tracked at once.
[Tracks]
enabled = true
multiMark = true
keyMode = single
style = chevrons
gamepad = -1
key = -1
wipeGamepad = -1
wipeKey = -1

; Highlights without name pop-ups.
[Labels]
enable = false

; Containers stand out in yellow. People are not highlighted.
[Categories]
containerColor = 0xFFD800
actor = false

[Effects]
screenEnabled = true
screenStrength = 1.0

[Tint]
enable = true
overlay = true

[Sound]
enabled = false

; None of Scavenger Sense's HUD extras: only the sense itself and the trails.
[Self]
bars = false
overhead = false
hudCorner = off

[Player]
level = false
power = false
shout = false
readyFlash = false
gold = false
weight = false
cold = false

[Vitals]
actors = false
combat = false
lockMark = off
pushTrueHUD = false
lockHaze = false
